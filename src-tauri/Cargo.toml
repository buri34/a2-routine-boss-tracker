[package]
name = "a2-routine-boss-tracker"
version = "0.2.37"
description = "AION2の日課・週課・ボス管理ツール"
authors = ["A2 ルーティン&ボストラッカー contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "aion2_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "A2RoutineBossTracker"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
notify-rust = "4.18.2"

[dev-dependencies]
tempfile = "3"
