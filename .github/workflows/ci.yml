name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy

      - name: Install dependencies
        run: npm ci

      - name: JavaScript tests and public-release scan
        run: npm test

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Build Windows portable executable and NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Verify Windows package outputs
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/target/release/A2RoutineBossTracker.exe")) {
            throw "Portable executable was not generated"
          }
          if (-not (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue)) {
            throw "NSIS installer was not generated"
          }
